<!doctype html>
<html lang="en">
<head>

<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root{--bg:#0C1A18;--ink:#F2EEE6;--body:#BDBAB1;--muted:#95948B;--jade:#4FC9AE;--line:#22403B}
  :root[data-theme="light"]{--bg:#FAF8F3;--ink:#10201D;--body:#3C4A46;--muted:#706C64;--jade:#0B6E5F;--line:#E2DBCC}
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){--bg:#FAF8F3;--ink:#10201D;--body:#3C4A46;--muted:#706C64;--jade:#0B6E5F;--line:#E2DBCC}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--body);
       font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.62;
       display:flex;align-items:center;min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:620px;margin:0 auto;padding:40px 20px}
  .num{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;font-size:11.5px;
       letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  h1{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;color:var(--ink);margin:0 0 18px;
     font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
  p{margin:0 0 18px;max-width:52ch}
  a{color:var(--jade)}
  .btn{display:inline-block;margin-top:14px;font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
       font-size:14px;text-decoration:none;padding:13px 22px;border-radius:4px;
       background:var(--jade);color:var(--bg);font-weight:500}
</style>
</head>
<body>
  <div class="wrap">
    <p class="num">404 / Page not found</p>
    <h1>That page is not here.</h1>
    <p>There is only one page on this site, so a link to anything else is either
       out of date or mistyped.</p>
    <p><a href="/">Go to bryanesguerra.com</a>, or email
       <a href="mailto:bryan@bryanesguerra.com">bryan@bryanesguerra.com</a> and

    <a class="btn" href="/#book">Book a 30-minute call</a>
  </div>
</body>
