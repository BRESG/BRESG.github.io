<style>
  :root{
    --bg:#0C1A18; --panel:#122522; --panel2:#17302C; --line:#22403B; --line2:#1B3733;
    --ink:#F2EEE6; --body:#BDBAB1; --muted:#8B8A80;
    --jade:#4FC9AE; --amber:#E4A64B; --rose:#E08A6B;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --wrap:1060px;
  }
  :root[data-theme="light"]{
    --bg:#FAF8F3; --panel:#FFFFFF; --panel2:#F3EFE6; --line:#E2DBCC; --line2:#EBE5D9;
    --ink:#10201D; --body:#3C4A46; --muted:#77736A;
    --jade:#0B6E5F; --amber:#A8660F; --rose:#B4593A;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#FAF8F3; --panel:#FFFFFF; --panel2:#F3EFE6; --line:#E2DBCC; --line2:#EBE5D9;
      --ink:#10201D; --body:#3C4A46; --muted:#77736A;
      --jade:#0B6E5F; --amber:#A8660F; --rose:#B4593A;
    }
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--body);font-family:var(--serif);font-size:17px;line-height:1.62;margin:0;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--wrap);margin:0 auto;padding-left:20px;padding-right:20px}
  h1,h2,h3,h4{font-family:var(--display);color:var(--ink);text-wrap:balance;margin:0;letter-spacing:-0.02em}
  a{color:var(--jade)}
  a:focus-visible,button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}
  section{border-top:1px solid var(--line2)}
  section>.wrap{padding-block:64px}
  .num{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  .num b{color:var(--jade);font-weight:500}
  .sec-h{max-width:60ch;margin-bottom:40px}
  .sec-h h2{font-size:clamp(25px,3.6vw,36px);font-weight:700;line-height:1.14}
  .sec-h p{margin:14px 0 0;color:var(--muted)}

  /* masthead */
  .mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
  .mast .wrap{padding-block:16px;display:flex;gap:16px 26px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .logo{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
  .logo b{color:var(--jade);font-weight:500}
  .mast nav{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--mono);font-size:12px}
  .mast nav a{color:var(--muted);text-decoration:none}
  .mast nav a:hover{color:var(--jade)}

  /* hero */
  .hero .wrap{padding-block:72px 40px}
  .avail{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--jade);border:1px solid var(--line);border-radius:999px;padding:5px 14px;margin-bottom:26px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--jade)}
  .hero h1{font-size:clamp(36px,7vw,68px);font-weight:700;line-height:1.02;letter-spacing:-.03em;max-width:15ch}
  .hero h1 em{font-style:normal;color:var(--jade)}
  .kicker{font-family:var(--mono);font-size:13px;color:var(--muted);margin:22px 0 0;letter-spacing:.02em}
  .lede{font-size:clamp(17px,2.1vw,20px);max-width:58ch;margin:20px 0 0}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
  .btn{font-family:var(--mono);font-size:14px;text-decoration:none;padding:13px 22px;border-radius:4px;display:inline-block}
  .btn.p{background:var(--jade);color:var(--bg);font-weight:500}
  .btn.p:hover{background:var(--ink)}
  .btn.s{border:1px solid var(--line);color:var(--ink)}
  .btn.s:hover{border-color:var(--jade);color:var(--jade)}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line2);border-block:1px solid var(--line2)}
  .stat{background:var(--bg);padding:26px 20px}
  .stat b{display:block;font-family:var(--display);font-size:clamp(26px,3.6vw,36px);font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1}
  .stat span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:10px}

  /* diagram */
  .dia{background:var(--panel)}
  .dia .wrap{padding-block:40px}
  .dia figcaption{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}
  .sx{overflow-x:auto}
  .sx svg{display:block;min-width:680px;width:100%;height:auto}
  .cdia{margin:24px 0 0;padding:24px 22px 22px;background:var(--panel);border:1px solid var(--line2);border-radius:6px}
  .cdia figcaption{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7}
  .book{margin:26px 0 30px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
  .book iframe{display:block;width:100%;height:720px;border:0}
  .book .bhead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 20px 0}
  .book-alt{margin:-18px 0 30px;font-size:14px;color:var(--muted)}
  .midcta{margin-top:40px;padding-top:28px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  .midcta p{margin:0;font-size:15px;color:var(--muted)}
  /* offer */
  .offer{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:30px 28px}
  .offer-top{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:20px}
  .offer-top h3{font-size:clamp(19px,2.4vw,23px);font-weight:700}
  .offer-meta{display:flex;gap:28px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-left:auto}
  .offer-meta b{display:block;color:var(--jade);font-size:17px;font-weight:600;letter-spacing:0;text-transform:none;margin-top:5px}
  .offer-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:26px 34px;margin-top:26px}
  .offer-cols h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;margin:0 0 13px}
  .offer-cols ul{margin:0;padding:0;list-style:none}
  .offer-cols li{position:relative;padding-left:18px;margin-bottom:10px;font-size:15.5px;line-height:1.5}
  .offer-cols li:before{content:"";position:absolute;left:0;top:10px;width:8px;height:1px;background:var(--jade)}
  .offer-cols .no li:before{background:var(--rose)}
  .offer-close{margin:26px 0 0;font-size:16px}
  .offer+.offer{margin-top:22px}
  .offer.first{background:var(--bg);border-style:dashed}
  .offer-step{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--jade);margin:0 0 14px}
  .quote{margin:24px 0 0;padding:20px 22px;background:var(--panel);border:1px solid var(--line2);border-left:2px solid var(--jade);border-radius:0 6px 6px 0}
  .me{display:grid;grid-template-columns:200px 1fr;gap:30px 34px;align-items:start;max-width:980px}
  .me-solo{max-width:68ch}
  .me-ph{margin:0;position:relative}
  .me-ph img{display:block;width:100%;height:auto;border-radius:8px;background:var(--panel2)}
  .me-ph figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:12px;line-height:1.6}
  .me-tx p:first-child{margin-top:0}
  @media (max-width:640px){.me{grid-template-columns:150px 1fr;gap:20px}}
  @media (max-width:430px){.me{grid-template-columns:1fr;gap:18px}.me-ph{max-width:190px}}
  .quote p{margin:0;font-size:16.5px;line-height:1.55;color:var(--ink)}
  .quote cite{display:block;margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-style:normal}
  .cdia .dlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}

  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}

  .card .ix{font-family:var(--mono);font-size:11px;color:var(--jade);letter-spacing:.1em}
  .card h3{font-size:17px;font-weight:600;margin-top:12px}
  .card p{margin:10px 0 0;font-size:15.5px}

  /* process */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px 30px}
  .step .ix{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.1em}
  .step h3{font-size:16px;font-weight:600;margin-top:10px;padding-top:12px;border-top:2px solid var(--jade)}
  .step p{margin:9px 0 0;font-size:15px}

  /* tools */
  .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:30px 34px}
  .tools h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chips span{font-family:var(--mono);font-size:12px;background:var(--panel2);color:var(--body);border-radius:3px;padding:5px 10px}

  /* cases */
  .case{border-top:1px solid var(--line);padding-block:38px}
  .case:first-of-type{border-top:0;padding-top:0}
  .ctop{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
  .ctop h3{font-size:clamp(20px,2.7vw,25px);font-weight:700}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
  .hook{font-family:var(--mono);font-size:13px;color:var(--jade);margin:10px 0 0}
  .rows{display:grid;gap:18px;margin-top:22px}
  .row{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start}
  .row dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:5px}
  .row dd{margin:0}
  .row dd p{margin:0 0 10px}
  .row dd p:last-child{margin-bottom:0}
  .found{margin:0;padding:0;list-style:none;display:grid;gap:10px}
  .found li{position:relative;padding-left:20px}
  .found li::before{content:"";position:absolute;left:2px;top:11px;width:7px;height:7px;background:var(--amber);border-radius:1px}

  /* faq */
  details{border-bottom:1px solid var(--line2)}
  summary{cursor:pointer;list-style:none;padding:18px 0;font-family:var(--display);font-weight:600;font-size:16.5px;color:var(--ink);display:flex;justify-content:space-between;gap:16px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-family:var(--mono);color:var(--jade);font-size:18px;flex:none}
  details[open] summary::after{content:"\2212"}
  details p{margin:0 0 20px;max-width:66ch;font-size:15.5px}


  /* zapier builds */
  .zap{border-top:1px solid var(--line);padding-block:34px}
  .zap:first-of-type{border-top:0;padding-top:0}
  .zap-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
  .zap-head h3{font-size:clamp(19px,2.5vw,23px);font-weight:700}
  .zap-meta{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--amber)}
  .zap-d{margin:12px 0 0;max-width:72ch}
  .zap-img{display:block;margin-top:20px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2);line-height:0}
  .zap-img img{width:100%;height:auto;display:block}
  .zap-img:hover{border-color:var(--jade)}

  /* contact */
  .contact{background:var(--panel);border-top:1px solid var(--line2)}
  .contact .wrap{padding-block:64px 72px}
  .contact h2{font-size:clamp(26px,3.8vw,40px);font-weight:700}
  .contact p.l{max-width:56ch;margin:16px 0 0}
  .clist{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px 30px;margin-top:38px}
  .clist h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .clist a,.clist span.v{display:block;margin-top:8px;font-size:15.5px;word-break:break-word}
  .foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between}

  /* edit mode */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel2);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
  #bar .sp{flex:1}
  #bar button{font-family:var(--mono);font-size:12.5px;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
  #bar button.p{background:var(--jade);color:var(--bg);border-color:var(--jade);font-weight:500}
  #bar button:disabled{opacity:.5;cursor:default}
  body.editing [data-e]{outline:1px dashed var(--line);outline-offset:3px;border-radius:2px}
  body.editing [data-e]:hover{outline-color:var(--jade)}
  body.editing [data-e]:focus{outline:2px solid var(--amber)}
  body.editing{padding-bottom:78px}
  #msg{color:var(--muted)}

  @media (max-width:560px){
    .row{grid-template-columns:1fr;gap:6px}
    .row dt{padding-top:0}
    section>.wrap{padding-block:46px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  function render(){
    document.getElementById("logo").innerHTML = ed("name","" + get("name"), "span") + '<b>.</b>';
    var h = "";

    // Where every "book a call" lands. If the calendar is ever removed from the
    // data, these fall back to the contact section instead of a dead anchor.
    var BOOKHREF = get("calendar") ? "#book" : "#contact";
    function midCta(line){
      return '<div class="midcta"><a class="btn p" href="' + BOOKHREF + '">Book a 30-minute call</a>'
        + '<p>' + line + '</p></div>';
    }

    // hero
    h += '<div class="hero"><div class="wrap">'
      + '<span class="avail"><span class="dot"></span>' + ed("avail",get("avail")) + '</span>'
      + '<h1>' + ed("h1a",get("h1a")) + ' <em>' + ed("h1b",get("h1b")) + '</em></h1>'
      + '<p class="kicker">' + ed("kicker",get("kicker")) + '</p>'
      + '<p class="lede">' + ed("lede",get("lede")) + '</p>'
      + '<div class="cta">'
      + '<a class="btn p" href="' + BOOKHREF + '">' + ed("cta1",get("cta1")) + '</a>'
      + '<a class="btn s" href="#work">' + ed("cta2",get("cta2")) + '</a>'
      + '</div></div></div>';

    // stats
    h += '<div class="stats">';
    (D.stats||[]).forEach(function(s,i){
      h += '<div class="stat"><b>' + ed("stats."+i+".n",s.n) + '</b><span>' + ed("stats."+i+".l",s.l) + '</span></div>';
    });
    h += '</div>';

    // diagram
    h += '<figure class="dia" style="margin:0"><div class="wrap">'
      + '<p class="num"><b>00</b> / A system I run today</p>'
      + '<div class="sx">' + SVG + '</div>'
      + '<figcaption>' + ed("diaCap",get("diaCap")) + '</figcaption>'
      + '</div></figure>';

    // about
    h += '<section id="about"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>01</b> / About</p>'
      + '<h2>' + ed("aboutH",get("aboutH")) + '</h2></div>'
      + '<div class="' + (get("photo") ? 'me' : 'me-solo') + '">'
      + (get("photo")
          ? '<figure class="me-ph"><img src="' + esc(get("photo")) + '" width="371" height="440" loading="lazy"'
            + ' alt="' + esc(get("photoAlt") || "Bryan Esguerra") + '">'
            + (get("photoCap") ? '<figcaption>' + ed("photoCap",get("photoCap")) + '</figcaption>' : '')
            + '</figure>'
          : '')
      + '<div class="me-tx">'
      + '<p>' + ed("about1",get("about1")) + '</p>'
      + '<p>' + ed("about2",get("about2")) + '</p>'
      + '<p>' + ed("about3",get("about3")) + '</p>'
      + '</div></div></div></section>';

    // services
    h += '<section id="services"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>02</b> / Services</p>'
      + '<h2>' + ed("svcH",get("svcH")) + '</h2></div><div class="grid4">';
    (D.services||[]).forEach(function(s,i){
      h += '<div class="card"><span class="ix">0'+(i+1)+'</span><h3>' + ed("services."+i+".h",s.h) + '</h3><p>' + ed("services."+i+".p",s.p) + '</p></div>';
    });
    h += '</div></div></section>';

    // process
    h += '<section id="process"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>03</b> / How I work</p>'
      + '<h2>' + ed("procH",get("procH")) + '</h2></div><div class="steps">';
    (D.steps||[]).forEach(function(s,i){
      h += '<div class="step"><span class="ix">0'+(i+1)+'</span><h3>' + ed("steps."+i+".h",s.h) + '</h3><p>' + ed("steps."+i+".p",s.p) + '</p></div>';
    });
    h += '</div></div></section>';

    // tools
    h += '<section id="tools"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>04</b> / Toolkit</p>'
      + '<h2>' + ed("toolH",get("toolH")) + '</h2>'
      + '<p>' + ed("toolP",get("toolP")) + '</p></div><div class="tools">';
    (D.tools||[]).forEach(function(g,i){
      h += '<div><h3>' + ed("tools."+i+".h",g.h) + '</h3><div class="chips">';
      (g.items||[]).forEach(function(it,j){ h += ed("tools."+i+".items."+j, it); });
      h += '</div></div>';
    });
    h += '</div></div></section>';

    // work
    h += '<section id="work"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>05</b> / Selected work</p>'
      + '<h2>' + ed("workH",get("workH")) + '</h2>'
      + '<p>' + ed("workP",get("workP")) + '</p></div>';
    (D.cases||[]).forEach(function(c,i){
      h += '<article class="case"><div class="ctop"><h3>' + ed("cases."+i+".t",c.t) + '</h3><span class="tag">' + ed("cases."+i+".tag",c.tag) + '</span></div>'
        + '<p class="hook">' + ed("cases."+i+".hook",c.hook) + '</p>'
        + (CASEDIA[i] ? '<figure class="cdia"><div class="sx">' + CASEDIA[i] + '</div><figcaption>'
            + ed("caseDia."+i+".cap", ((D.caseDia && D.caseDia[i] && D.caseDia[i].cap) || "")) + '</figcaption></figure>' : '')
        + '<dl class="rows">';
      (c.rows||[]).forEach(function(r,j){
        h += '<div class="row"><dt>' + ed("cases."+i+".rows."+j+".k",r.k) + '</dt><dd>';
        if(r.list){ h += '<ul class="found">';
          r.list.forEach(function(x,k){ h += '<li>' + ed("cases."+i+".rows."+j+".list."+k, x) + '</li>'; });
          h += '</ul>';
        } else {
          (r.v||[]).forEach(function(x,k){ h += '<p>' + ed("cases."+i+".rows."+j+".v."+k, x) + '</p>'; });
        }
        h += '</dd></div>';

      if (c.quote) {
        h += '<blockquote class="quote"><p>' + ed("cases."+i+".quote", c.quote) + '</p>'
          + (c.quoteBy ? '<cite>' + ed("cases."+i+".quoteBy", c.quoteBy) + '</cite>' : '')
          + '</blockquote>';
      }
      h += '</article>';
    });
    h += midCta('Bring the account you are least happy with. I will tell you what I would do with it.');
    h += '</div></section>';

    // zapier builds
    h += '<section id="zaps"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>06</b> / Zapier builds</p>'
      + '<h2>' + ed("zapsH",get("zapsH")) + '</h2>'
      + '<p>' + ed("zapsP",get("zapsP")) + '</p></div>';
    (D.zaps||[]).forEach(function(z,i){
      h += '<article class="zap">'
        + '<div class="zap-head"><h3>' + ed("zaps."+i+".t",z.t) + '</h3>'
        + '<span class="zap-meta">' + z.meta + '</span></div>'
        + '<p class="zap-d">' + ed("zaps."+i+".d",z.d) + '</p>'
        + '<a class="zap-img" href="' + esc(z.img) + '" target="_blank" rel="noopener">'
        + '<img src="' + esc(z.img) + '" alt="' + esc(z.alt) + '" loading="lazy"'
        + (z.w && z.h ? ' width="' + esc(z.w) + '" height="' + esc(z.h) + '"' : '') + '>'
        + '</a></article>';
    });
    h += '</div></section>';

    // faq
    h += '<section id="faq"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>07</b> / FAQ</p>'
      + '<h2>' + ed("faqH",get("faqH")) + '</h2></div><div>';
    (D.faq||[]).forEach(function(f,i){
      h += '<details><summary>' + ed("faq."+i+".q",f.q) + '</summary><p>' + ed("faq."+i+".a",f.a) + '</p></details>';
    });
    h += '</div></div></section>';

    // offer
    h += '<section id="offer"><div class="wrap"><div class="sec-h">'
      + '<p class="num"><b>08</b> / What it costs</p>'
      + '<h2>' + ed("offerH",get("offerH")) + '</h2>'
      + '<p>' + ed("offerP",get("offerP")) + '</p></div>'
      + '<div class="offer first"><p class="offer-step">Start small</p><div class="offer-top">'
      + '<h3>' + ed("auditName",get("auditName")) + '</h3>'
      + '<div class="offer-meta"><span>Price<b>' + ed("auditPrice",get("auditPrice")) + '</b></span>'
      + '<span>Delivery<b>' + ed("auditTime",get("auditTime")) + '</b></span></div></div>'
      + '<div class="offer-cols">'
      + '<div><h4>What is in it</h4><ul>';
    (D.auditIn||[]).forEach(function(x,i){ h += '<li>' + ed("auditIn."+i, x) + '</li>'; });
    h += '</ul></div><div class="no"><h4>What is not</h4><ul>';
    (D.auditOut||[]).forEach(function(x,i){ h += '<li>' + ed("auditOut."+i, x) + '</li>'; });
    h += '</ul></div><div><h4>What I need from you</h4><ul>';
    (D.auditNeed||[]).forEach(function(x,i){ h += '<li>' + ed("auditNeed."+i, x) + '</li>'; });
    h += '</ul></div></div>'
      + '<p class="offer-close">' + ed("auditNote",get("auditNote")) + '</p>'
      + '</div>'

      + '<div class="offer"><p class="offer-step">Or the whole thing</p><div class="offer-top">'
      + '<h3>' + ed("offerName",get("offerName")) + '</h3>'
      + '<div class="offer-meta"><span>Price<b>' + ed("offerPrice",get("offerPrice")) + '</b></span>'
      + '<span>Delivery<b>' + ed("offerTime",get("offerTime")) + '</b></span></div></div>'
      + '<div class="offer-cols">'
      + '<div><h4>What is in it</h4><ul>';
    (D.offerIn||[]).forEach(function(x,i){ h += '<li>' + ed("offerIn."+i, x) + '</li>'; });
    h += '</ul></div><div class="no"><h4>What is not</h4><ul>';
    (D.offerOut||[]).forEach(function(x,i){ h += '<li>' + ed("offerOut."+i, x) + '</li>'; });
    h += '</ul></div><div><h4>What I need from you</h4><ul>';
    (D.offerNeed||[]).forEach(function(x,i){ h += '<li>' + ed("offerNeed."+i, x) + '</li>'; });
    h += '</ul></div></div>'
      + '<p class="offer-close">' + ed("offerPriceNote",get("offerPriceNote")) + ' ' + ed("offerTimeNote",get("offerTimeNote")) + '</p>'
      + '<p class="offer-close">' + ed("offerClose",get("offerClose")) + '</p>'
      + '<p class="offer-close">' + ed("offerBuildNote",get("offerBuildNote")) + '</p>'
      + '</div>'
      + midCta('No charge for the call, and no obligation after it.')
      + '</div></section>';

    // contact
    var mail = String(get("email")||"");
    h += '<section class="contact" id="contact"><div class="wrap">'
      + '<p class="num"><b>09</b> / Contact</p>'
      + '<h2>' + ed("ctH",get("ctH")) + '</h2>'
      + '<p class="l">' + ed("ctP",get("ctP")) + '</p>'
      + (get("calendar")
          ? '<div class="book" id="book"><p class="bhead">Pick a time</p>'
            + '<iframe data-ghl-calendar src="' + esc(get("calendar")) + '" title="Book a call" loading="lazy"></iframe></div>'
            + '<p class="book-alt">Calendar not loading? Some browsers block it. '
            + '<a class="book-link" data-ghl-calendar href="' + esc(get("calendar")) + '" target="_blank" rel="noopener">Open the booking page in a new tab</a>.</p>'
          : '')
      + '<div class="clist">'
      + '<div><h4>Email</h4><a href="mailto:' + esc(mail) + '">' + ed("email",mail) + '</a></div>'
      + (get("github") ? '<div><h4>Code</h4><a href="https://' + esc(get("github")) + '" target="_blank" rel="noopener">' + ed("github",get("github")) + '</a></div>' : '')
      + (get("upwork") ? '<div><h4>Upwork</h4><a href="' + esc(get("upwork")) + '">' + ed("upwork",get("upwork")) + '</a></div>' : '')
      + (get("ojph") ? '<div><h4>OnlineJobs.ph</h4><a href="' + esc(get("ojph")) + '">' + ed("ojph",get("ojph")) + '</a></div>' : '')
      + '<div><h4>Location</h4><span class="v">' + ed("loc",get("loc")) + '</span></div>'
      + '</div>'
      + '<div class="foot"><span>' + ed("name2", get("name")) + ' · Automation &amp; CRM systems</span><span>' + ed("rate",get("rate")) + '</span></div>'
      + '</div></section>';

    document.getElementById("app").innerHTML = h;
  }

  render();

  // ---- edit mode (only for viewers who can publish) ----
  var editing = false, snapshot = null, api = null;
  var bar = document.getElementById("bar");
  var msg = document.getElementById("msg");
  var saveBtn = document.getElementById("save");
  var cancelBtn = document.getElementById("cancel");

  function nodes(){ return Array.prototype.slice.call(document.querySelectorAll("[data-e]")); }

  function startEdit(){
    editing = true;
    snapshot = JSON.stringify(D);
    document.body.classList.add("editing");
    bar.hidden = false;
    msg.textContent = "Edit mode. Click any text to change it.";
    nodes().forEach(function(n){ n.setAttribute("contenteditable","true"); });
  }
  function stopEdit(){
    editing = false;
    document.body.classList.remove("editing");
    bar.hidden = true;
    nodes().forEach(function(n){ n.removeAttribute("contenteditable"); });
  }
  function collect(){
    nodes().forEach(function(n){
      var p = n.getAttribute("data-e");
      if(p === "name2") p = "name";
      set(p, (n.innerText||"").replace(/\s+\n/g,"\n").trim());
    });
  }

  cancelBtn.addEventListener("click", function(){
    try { D = JSON.parse(snapshot); } catch(e){}
    stopEdit(); render(); addEditButton();
  });

  saveBtn.addEventListener("click", function(){
    if(!api) return;
    collect();
    saveBtn.disabled = true; cancelBtn.disabled = true;
    msg.textContent = "Saving...";
    var next = PRISTINE.replace(
      /(<script type="application\/json" id="data">)([\s\S]*?)(<\/script>)/,
      function(_, a, __, c){ return a + "\n" + JSON.stringify(D, null, 2) + "\n" + c; }
    );
    api.publish(next).then(function(){
      msg.textContent = "Saved. The page is reloading to the new version.";
    }).catch(function(err){
      saveBtn.disabled = false; cancelBtn.disabled = false;
      var code = err && err.code ? err.code : "";
      msg.textContent = (code === "conflict")
        ? "Someone else saved first. Reload and try again."
        : "Could not save" + (code ? " (" + code + ")" : "") + ". Your text is still on screen.";
    });
  });

  function addEditButton(){
    if(document.getElementById("editBtn")) return;
    var b = document.createElement("button");
    b.id = "editBtn"; b.type = "button"; b.textContent = "Edit this page";
    b.style.cssText = "position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;font-family:var(--mono);font-size:12.5px;padding:10px 16px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer";
    b.addEventListener("click", function(){ b.remove(); startEdit(); });
    document.body.appendChild(b);
  }

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(a){
      if(!a) return;            // viewer cannot publish: page stays read-only
      api = a;
      addEditButton();
    }).catch(function(){});
  }
})();
</script>

<script>
// The embed script only rewrites an iframe src, so the plain fallback link would
// otherwise lose the utm_* values and the click id. Copy the decorated src across
// so a booking made through the fallback still carries where it came from.
(function(){
  "use strict";
  function sync(){
    var f = document.querySelector('.book iframe[data-ghl-calendar]');
    var a = document.querySelector('a.book-link[data-ghl-calendar]');
    if(!f || !a) return;
    var src = f.getAttribute('src');
    if(src) a.setAttribute('href', src);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
  else sync();
})();
</script>
